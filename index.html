          clearTimeout(slowTimer);
          showMessage('fail');
        }

        retry.addEventListener('click', function () { window.location.reload(); });

        // Only complain about genuinely slow loads, never delay a fast one.
        slowTimer = setTimeout(function () { showMessage('slow'); }, 12000);

        // Critical resource errors (the game module or one of its imports)
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (el && el.tagName === 'SCRIPT' && /main\.js/.test(el.src || '')) { fail('main.js'); return; }
          // Runtime errors thrown by our own code or by Phaser while booting
          if (e && e.filename && (e.filename.indexOf(location.origin) === 0 || e.filename.indexOf('esm.sh') !== -1)) {
            fail(e.message);
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (!isReady) fail(e && e.reason);
        });

        window.SAMIX = { ready: ready, fail: fail };
      })();
    </script>

            <p id="difficulty-hint" class="difficulty-hint"></p>
            <button id="difficulty-confirm-btn" class="btn btn-primary difficulty-confirm-btn" type="button">Start Match</button>
          </section>
        </main>

        <footer class="start-footer">CREATED BY SAMI</footer>
      </div>

      <!-- ── In-game pause button ── -->
      <button id="pause-btn" class="pause-btn" type="button" aria-label="Pause game" tabindex="-1">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="3" y="2" width="3.4" height="12" rx="1.2"/><rect x="9.6" y="2" width="3.4" height="12" rx="1.2"/></svg>
      </button>

      <!-- ── Countdown overlay (hidden by default) ── -->
      <div id="countdown-overlay" class="countdown-overlay hidden">
        <div class="countdown-inner">
          <div class="countdown-badge" id="countdown-badge">First to 7 wins</div>
          <div class="countdown-number" id="countdown-number">3</div>
          <div class="countdown-sub" id="countdown-sub">Get ready</div>

      <!-- ── Pause menu (hidden by default) ── -->
      <div id="pause-overlay" class="overlay pause-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
        <div class="sheet">
          <p class="eyebrow">Match in progress</p>
          <h2 class="sheet-title" id="pause-title">Paused</h2>
          <p class="sheet-score sheet-score--small" id="pause-score" aria-label="Current score"></p>

          <button class="btn btn-secondary" id="restart-btn" type="button">Restart</button>
          <button class="btn btn-ghost" id="pause-menu-btn" type="button">Main Menu</button>

      <div id="game-over-overlay" class="overlay game-over-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">

        <div id="panel-root"></div>
